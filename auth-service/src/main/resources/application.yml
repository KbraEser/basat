spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/auth_db}
    username: ${DB_USERNAME:basat}
    password: ${DB_PASSWORD:basat}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  threads:
    virtual:
      enabled: true

server:
  port: 8081