services:
  postgres:
    image: timescale/timescaledb:2.30.1-pg17
    container_name: basat-postgres
    environment:
      POSTGRES_USER: basat
      POSTGRES_PASSWORD: basat
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8-alpine
    container_name: basat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data: