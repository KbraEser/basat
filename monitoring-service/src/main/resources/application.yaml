spring:
  application:
    name: monitoring-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/monitoring_db}
    username: ${DB_USERNAME:basat}
    password: ${DB_PASSWORD:basat}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: monitoring-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: io.basat.monitoring.reading.ReadingMessage
        spring.json.use.type.headers: false

  threads:
    virtual:
      enabled: true

server:
  port: 8082

app:
  kafka:
    readings-topic: meter.readings
    readings-dlt-topic: meter.readings.DLT
