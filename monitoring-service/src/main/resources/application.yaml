spring:
  application:
    name: monitoring-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/monitoring_db}
    username: ${DB_USERNAME:basat}
    password: ${DB_PASSWORD:basat}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: monitoring-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: io.basat.monitoring.reading.ReadingMessage
        spring.json.use.type.headers: false

  threads:
    virtual:
      enabled: true

server:
  port: 8082

app:
  kafka:
    readings-topic: meter.readings
    readings-dlt-topic: meter.readings.DLT
  # TRY per kWh excluding taxes (energy + distribution), EPDK AG single-term "Kamu ve Özel Hizmetler ile Diğer"
  # three-period tariff, effective 2026-04-04
  tariff:
    type: TIME_OF_USE
    single-rate: 5.934056
    day: 5.981988
    peak: 8.453271
    night: 4.015682
  # kg CO2 per kWh at distribution-connected consumption points, ETKB 2022 production/consumption emission factors
  carbon:
    grid-factor: 0.474
